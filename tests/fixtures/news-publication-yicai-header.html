<div class="intro">模型更聪明了，账单也更难算了。</div><div class="m-txt"><div id="multi-text" class="f-cb"><p>时隔7个月，谷歌终于更新了Flash模型之外的大模型，重新加入最前沿大模型的竞争。</p><p>北京时间10月14日，谷歌正式发布Gemini 4 Argon，这一模型主打复杂、多步骤的现实任务，覆盖软件工程、金融、法律、网络安全和科学研究等领域。与主要负责对话和内容生成的模型相比，Argon更强调多步骤推理与任务执行，希望直接进入专业工作流，完成代码重构、业务分析、漏洞修复，甚至辅助科研实验设计。</p></div></div></div>
