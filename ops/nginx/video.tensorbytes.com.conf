server {
    listen 80;
    server_name video.tensorbytes.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://video.tensorbytes.com$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name video.tensorbytes.com;
    ssl_certificate /etc/letsencrypt/live/video.tensorbytes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video.tensorbytes.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1g;
    # State and session replies include account history. Compress JSON so that
    # mobile actions do not spend their request timeout downloading old records.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types application/json text/css application/javascript image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = / {
        proxy_pass http://127.0.0.1:8787/qingjian/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
    }
    location = /qingjian { return 308 /qingjian/; }
    location ^~ /qingjian/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
    }
    location / { return 404; }
}
